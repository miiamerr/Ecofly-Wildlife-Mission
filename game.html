<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>EcoFly - Wildlife Mission - Game</title>
        <link rel="stylesheet" href="game.css" />
        <script src="game.js" defer></script>
    </head>
    <body>
        <main class="game">
            <header class="top-bar">
                <a href="home.html" id="exit-btn" class="menu-btn">Menu</a>

                <div class="fuel-box">
                    <label for="fuel-bar">Fuel: <span id="fuel-text">100%</span></label>
                    <meter id="fuel-bar" min="0" max="100" value="100">100%</meter>
                </div>
            </header>

            <section class="quiz" aria-label="Question">
                <div class="quiz-top">
                    <img id="animal-img" src="animal.png" alt="Endangered animal">
                    <div>
                        <h1 id="question">Select a destination on the map.</h1>
                    </div>
                </div>

                <div class="options">
                    <button type="button" class="option" data-choice="A">A</button>
                    <button type="button" class="option" data-choice="B">B</button>
                    <button type="button" class="option" data-choice="C">C</button>
                    <button type="button" class="option" data-choice="D">D</button>
                </div>

                <p id="feedback" aria-live="polite"></p>
            </section>

            <section class="map-section" aria-label="Map">
                <div class="legend">
                    <span><i class="dot green"></i>Easy</span>
                    <span><i class="dot orange"></i>Medium</span>
                    <span><i class="dot red"></i>Hard</span>
                </div>

                <div id="map">
                    <div class="map-frame">
                        <img src="Map.jpg" alt="Map of Africa" class="map-img">

                        <button type="button" class="pin orange" style="top: 75%; left: 65%;" data-top="75%" data-left="65%" data-destination="madagascar" aria-label="Madagascar">1</button>
                        <button type="button" class="pin green" style="top: 63%; left: 59%;" data-top="63%" data-left="59%" data-destination="tanzania" aria-label="Tanzania">2</button>
                        <button type="button" class="pin red" style="top: 56%; left: 61%;" data-top="56%" data-left="61%" data-destination="kenya" aria-label="Kenya">3</button>
                        <button type="button" class="pin green" style="top: 56%; left: 53%;" data-top="56%" data-left="53%" data-destination="dr-congo" aria-label="Democratic Republic of the Congo">4</button>
                        <button type="button" class="pin orange" style="top: 82%; left: 55%;" data-top="82%" data-left="55%" data-destination="south-africa" aria-label="South Africa">5</button>
                        <button type="button" class="pin green" style="top: 75%; left: 49%;" data-top="75%" data-left="49%" data-destination="namibia" aria-label="Namibia">6</button>
                        <button type="button" class="pin green" style="top: 47%; left: 62%;" data-top="47%" data-left="62%" data-destination="ethiopia" aria-label="Ethiopia">7</button>
                        <button type="button" class="pin orange" style="top: 37%; left: 57%;" data-top="37%" data-left="57%" data-destination="sudan" aria-label="Sudan">8</button>
                        <button type="button" class="pin red" style="top: 49%; left: 67%;" data-top="49%" data-left="67%" data-destination="somalia" aria-label="Somalia">9</button>
                        <button type="button" class="pin orange" style="top: 16%; left: 41%;" data-top="16%" data-left="41%" data-destination="morocco" aria-label="Morocco">10</button>
                        <button type="button" class="pin red" style="top: 59%; left: 72%;" data-top="59%" data-left="72%" data-destination="seychelles" aria-label="Seychelles">11</button>
                        <button type="button" class="pin red" style="top: 72%; left: 57%;" data-top="72%" data-left="57%" data-destination="zimbabwe" aria-label="Zimbabwe">12</button>
                    </div>

                    <span id="plane" aria-hidden="true">✈️</span>
                </div>
            </section>
        </main>
    </body>
</html>
